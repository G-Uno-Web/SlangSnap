        const t = T();
        document.documentElement.lang = t.htmlLang;
        document.title = t.docTitle;
        document.getElementById("siteTitle").innerHTML = t.title;
        document.getElementById("siteSub").textContent = t.sub;
        document.getElementById("statsBar").innerHTML = t.stats
          .map(
            (s) =>
              `<span class="stat-chip">${s.replace("{n}", WORDS.length)}</span>`,
          )
          .join("");
        searchInput.placeholder = t.placeholder;
        const rand = document.getElementById("randomBtn");
        rand.textContent = t.random;
        rand.title = t.randomTitle;
        document.getElementById("searchBtn").textContent = t.search;
        document.getElementById("footerBar").textContent = t.footer;
        document.getElementById("langToggle").textContent = t.toggle;
        renderCats();
        render();
      }

      function filtered() {
        return WORDS.filter((w) => {
          const catOk = activeCat === "all" || w.cat === activeCat;
          const q = query.trim().toLowerCase();
          const qOk =
            !q ||
            w.term.toLowerCase().includes(q) ||
            w.zh.includes(q) ||
            w.en.toLowerCase().includes(q);
          return catOk && qOk;
        });
      }

      function render() {
        const t = T();
        const list = filtered();
        if (!list.length) {
          grid.innerHTML = `<div class="empty">${t.empty.replace("{q}", query)}</div>`;
          return;
        }
        grid.innerHTML = list
          .map((w, i) => {
            const h = HEAT_LABEL[w.heat];
            const catName =
              ((CATS.find((c) => c.id === w.cat) || {}).label || {})[lang] ||
              "";
            const meaningLine =
              lang === "cn"
                ? `<div class="zh">${w.zh}</div><div class="en">${w.en}</div>`
                : `<div class="en">${w.en}</div>`;
            return `
    <div class="card" onclick="openModal(${WORDS.indexOf(w)})">
      <div class="emoji">${w.emoji}</div>
      <h3>${w.term}
        ${w.term.length < 12 ? `<span class="pron">${w.pron}</span>` : ""}
        <span class="badge ${h.cls}">${h[lang]} ${w.trend}</span>
      </h3>
      ${meaningLine}
      <span class="cat-tag">${catName}</span>
    </div>`;
          })
          .join("");
      }

      function openModal(idx) {
        const w = WORDS[idx];
        const h = HEAT_LABEL[w.heat];
        const t = T();
        const catName =
          ((CATS.find((c) => c.id === w.cat) || {}).label || {})[lang] || "";
        const zhSection =
          lang === "cn"
            ? `<div class="section"><h4>${t.secZh}</h4><p><strong>${w.zh}</strong></p></div>`
            : "";
        const trLine = lang === "cn" ? `<span class="tr">${w.tr}</span>` : "";
        const originText =
          lang === "cn" ? w.origin : ORIGIN_EN[w.term] || w.origin;
        modal.innerHTML = `
    <button class="close" onclick="closeModal()">✕</button>
    <div class="m-emoji">${w.emoji}</div>
    <h2>${w.term}</h2>
    <div class="m-pron">${w.pron}</div>
    <div class="m-badges">
      <span class="badge ${h.cls}">${h[lang]} ${w.trend}</span>
      <span class="badge classic">${catName}</span>
    </div>
    ${zhSection}
    <div class="section"><h4>${t.secEn}</h4><p>${w.en}</p></div>
    <div class="section"><h4>${t.secEx}</h4>
      <div class="example">"${w.example}"${trLine}</div>
    </div>
    <div class="section"><h4>${t.secOrigin}</h4><div class="origin">${originText}</div></div>
  `;
        mask.classList.add("open");
      }

      function closeModal() {
        mask.classList.remove("open");
      }
      mask.onclick = (e) => {
        if (e.target === mask) closeModal();
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      searchInput.addEventListener("input", (e) => {
        query = e.target.value;
        render();
      });
      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") render();
      });
      document.getElementById("searchBtn").onclick = () => {
        render();
      };

      document.getElementById("randomBtn").onclick = () => {
        const list = filtered();
        const w = list.length
          ? list[Math.floor(Math.random() * list.length)]
          : WORDS[Math.floor(Math.random() * WORDS.length)];
        openModal(WORDS.indexOf(w));
      };

      document.getElementById("langToggle").onclick = () => {
        lang = lang === "en" ? "cn" : "en";
        store.set("slangsnap-lang", lang);
        closeModal();
        applyLang();
      };

      applyLang();
    </script>
  </body>
</html>
